# 共享运行时公共配置：由各服务通过 spring.config.import 引入
spring:
  # 多数据源配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    # 主数据源 - RiskLendPro（业务数据）
    primary:
      jdbc-url: ${PRIMARY_DB_URL:jdbc:mysql://47.109.109.231:3306/RiskLendPro?useUnicode=true&characterEncoding=UTF-8&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
      username: ${PRIMARY_DB_USERNAME:admin}
      password: ${PRIMARY_DB_PASSWORD:admin}
      driver-class-name: com.mysql.cj.jdbc.Driver
      # 注意：这里必须用「扁平键」，不能写成 hikari.xxx。
      # 原因：DataSourceConfig 用 DataSourceBuilder.create().build() 生成 HikariDataSource，
      # 并以 prefix="spring.datasource.primary" 直接绑定到 HikariDataSource 对象上。
      # HikariDataSource 上并没有 setHikari(...) 方法，所以 hikari.* 会被静默忽略，
      # 最终退回 Hikari 默认值 maximumPoolSize=10 / minimumIdle=10（一启动就占满且不释放）。
      # 扁平键才能正确绑定到 HikariDataSource.setMaximumPoolSize() 等方法。
      connection-timeout: 30000
      # 数据库在公网（47.109.109.231），单次往返约 8ms，连接过少会导致请求排队、
      # 表现为「均值高、最小值低」的抖动；主库提到 12，从库提到 6。
      maximum-pool-size: 12
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      validation-timeout: 5000
    # 从数据源 - credit_data_db（Python同步的风控数据）
    credit:
      jdbc-url: ${CREDIT_DB_URL:jdbc:mysql://47.109.109.231:3306/credit_data_db?useUnicode=true&characterEncoding=UTF-8&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
      username: ${CREDIT_DB_USERNAME:admin}
      password: ${CREDIT_DB_PASSWORD:admin}
      driver-class-name: com.mysql.cj.jdbc.Driver
      connection-timeout: 30000
      maximum-pool-size: 6
      minimum-idle: 1
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      validation-timeout: 5000

  # 邮件服务器配置
  mail:
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME:3272548868@qq.com}
    password: ${MAIL_PASSWORD:zivjkqqmyqffchcf}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
          auth: true
          ssl:
            enable: true
          timeout: 5000
          connectiontimeout: 5000
          writetimeout: 5000
        debug: true

  # Redis配置
  data:
    redis:
      host: ${REDIS_HOST:47.109.109.231}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: 0
      timeout: 10000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1

security:
  jwt:
    # Override in every non-local environment.
    secret: ${JWT_SECRET:MySecretKeyForJWT2024VeryLongAndSafe12345678}
  internal:
    api-token: ${INTERNAL_API_TOKEN:dev-internal-token-change-me}
  demo:
    # 匿名演示接口总开关，默认关闭。
    # 关闭时：控制器不注册（404）、JwtFilter 不放行、SecurityConfig 不加白名单，三层同时收紧。
    # 需要演示时用环境变量 DEMO_IMAGE_VERIFY_ENABLED=true 临时打开，演示完立即关闭。
    image-verify-enabled: ${DEMO_IMAGE_VERIFY_ENABLED:false}
    # 打开时按客户端 IP 限流，防止免鉴权接口被当作免费 OCR/检测算力刷。
    image-verify-rate-limit-per-minute: ${DEMO_IMAGE_VERIFY_RATE_LIMIT:10}

risk:
  schema:
    auto-migrate-account-status: true
    auto-migrate-admin-role: true
  blacklist-sync:
    api-token: "bl-sync-a3f8c2e1-7b4d-4f9a-9e6c-1d2b5a8f3c7e"
  coze:
    enabled: true
    api-url: https://api.coze.cn/v1/workflow/run
    workflow-id: "7690804879720710159"
    workflow-version: "v0.0.1"
    # PAT 不写在本文件。复制 config/application-local.yml.example 到 config/local/application-local.yml 后填写 risk.coze.token
    # 每周日 02:00
    cron: "0 0 2 ? * SUN"
    read-timeout-ms: 300000
    connect-timeout-ms: 10000
  supplement:
    # 相对路径基于 JVM 启动目录（项目根）；生产可改为绝对路径如 D:/data/risklendpro/upload/risk-supplement
    upload-dir: ${RISK_UPLOAD_DIR:upload/risk-supplement}
    retention-days: 30
    max-file-size-mb: 5
    allowed-extensions: jpg,jpeg,png,pdf
    # Tesseract OCR tessdata 目录（含 chi_sim.traineddata 等语言包）。留空时使用 Tesseract 默认路径。
    tessdata-path: ${TESSERACT_TESSDATA_PATH:tessdata}

# 业务服务 CORS（SecurityConfig）。本地可在 application-local.yml 覆盖。
cors:
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}

# 腾讯云 COS：密钥不要写进仓库。复制 config/application-local.yml.example 到 config/local/application-local.yml 后填写。
storage:
  provider: ${STORAGE_PROVIDER:cos}
  bucket: ${COS_BUCKET:}
  region: ${COS_REGION:ap-guangzhou}
  secret-id: ${COS_SECRET_ID:}
  secret-key: ${COS_SECRET_KEY:}
  app-id: ${COS_APP_ID:}
  cdn-domain: ${COS_CDN_DOMAIN:}
  private-bucket: ${COS_PRIVATE_BUCKET:true}
  presign-expire-minutes: ${COS_PRESIGN_EXPIRE_MINUTES:15}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id

logging:
  level:
    root: info
    org.example.risklendpro: debug
