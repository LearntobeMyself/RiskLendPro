spring:
  application:
    name: cs-service
  config:
    import:
      - classpath:application-common.yml
      - optional:file:./config/local/application-local.yml
      - optional:file:../../config/local/application-local.yml

server:
  port: ${CS_SERVICE_PORT:8084}

service:
  risk:
    url: ${RISK_SERVICE_URL:http://localhost:8082}
  loan:
    url: ${LOAN_SERVICE_URL:http://localhost:8083}

cs:
  schema:
    auto-migrate: ${CS_AUTO_MIGRATE:true}
  llm:
    base-url: ${CS_LLM_BASE_URL:https://api.deepseek.com}
    # 必填。复制 config/application-local.yml.example 到 config/local/application-local.yml 后填写，或设置环境变量 CS_LLM_API_KEY。
    api-key: ${CS_LLM_API_KEY:}
    model: ${CS_LLM_MODEL:deepseek-chat}
    max-tokens: 1024
    temperature: 0.3
    timeout-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info
