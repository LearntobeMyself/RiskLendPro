spring:
  application:
    name: risk-service
  config:
    import:
      - classpath:application-common.yml
      # 扣子 PAT。仓库根目录启动读第一条；从 services/risk-service 目录启动读第二条。文件缺失不阻止启动。
      - optional:file:./config/local/application-local.yml
      - optional:file:../../config/local/application-local.yml

server:
  port: ${RISK_SERVICE_PORT:8082}

service:
  user:
    url: ${USER_SERVICE_URL:http://localhost:8081}
  loan:
    url: ${LOAN_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info
