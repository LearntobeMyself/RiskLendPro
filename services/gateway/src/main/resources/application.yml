spring:
  application:
    name: risklendpro-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service-health
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/platform/user/health
              filters:
                - SetPath=/actuator/health
            - id: risk-service-health
              uri: ${RISK_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/platform/risk/health
              filters:
                - SetPath=/actuator/health
            - id: loan-service-health
              uri: ${LOAN_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/platform/loan/health
              filters:
                - SetPath=/actuator/health
            - id: cs-service-health
              uri: ${CS_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/platform/cs/health
              filters:
                - SetPath=/actuator/health
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/user/**,/api/v1/auth/**,/api/v1/admin/login,/api/v1/admin/register,/api/v1/admin/profile,/api/v1/admin/users/**,/api/v1/admin/system/**
              filters:
                - StripPrefix=2
            - id: risk-service
              uri: ${RISK_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/risk/**,/api/v1/sync/**,/api/v1/admin/risk/**,/api/v1/admin/b-card/**,/api/v1/admin/supplement/**
              filters:
                - StripPrefix=2
            - id: loan-service
              uri: ${LOAN_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/loan/**,/api/v1/repayment/**,/api/v1/admin/loan/**,/api/v1/admin/credit/**,/api/v1/admin/repayment/**,/api/v1/admin/bi/**,/api/v1/admin/dashboard/**
              filters:
                - StripPrefix=2
            - id: cs-service
              uri: ${CS_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/cs/**

server:
  port: ${GATEWAY_PORT:8088}

security:
  jwt:
    # Override in every non-local environment.
    secret: ${JWT_SECRET:MySecretKeyForJWT2024VeryLongAndSafe12345678}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
